<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Chat with your OpenAI-compatible model servers."
    />

    <!-- Add to Home Screen (iOS + standards-track). apple-mobile-web-app-*
         are needed because iOS Safari has never fully honoured the
         manifest for these — start_url/display/icons come from the
         manifest, but the standalone/title/status-bar behaviour on iOS
         specifically comes from these tags. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aientic" />
    <style>
      /* The two --bg values from index.css, inlined so the first paint is
         already the right colour. color-scheme goes with them: without it the
         scrollbars and form controls paint light before the CSS lands. */
      html {
        color-scheme: light;
        background-color: #ffffff;
      }
      html.dark {
        color-scheme: dark;
        background-color: #000000;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..600&family=Playfair+Display:ital,wght@0,400..600;1,400..600&display=swap"
    />
    <title>Aientic</title>
    <!-- Runs during parsing (before first paint) so the app never flashes
         the wrong theme; see theme-init.js for the rest of the story. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
